name: Install Champions Intro
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-champions-intro.yml'
      - 'public/champions/intro-inline.js'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire embedded intro
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/champions/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script id="flowfire-intro-script">'
          loader='<script src="./intro-inline.js?v=2"></script>'
          if loader not in s:
              if marker not in s:
                  raise SystemExit('intro marker not found')
              s=s.replace(marker,loader+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated page
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "flowfire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/champions/index.html
          git commit -m "fix: use embedded Champions intro video"
          git push
