<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowfire Champions | Fusão Suprema</title><style>:root{--bg:#07060a;--panel:#121018;--line:#2f2738;--o:#ff6a00;--o2:#ff9d4a;--muted:#a8a0af;--gold:#ffd34d;--silver:#d9dde4;--bronze:#d98645}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 80% 0,rgba(255,106,0,.12),transparent 25rem),linear-gradient(180deg,#060509,#09070d 55%,#060509);color:#fff}button,input,select{font:inherit}.container{width:min(calc(100% - 28px),1120px);margin:auto}header{position:sticky;top:0;z-index:30;background:rgba(7,6,10,.93);backdrop-filter:blur(14px);border-bottom:1px solid #201a27}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:-.035em;font-size:20px}.brand span,h1 span{color:var(--o)}.btn{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(135deg,#ff7800,#ff5400);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 8px 28px rgba(255,106,0,.18)}.btn.ghost{background:#17121f;border:1px solid var(--line);box-shadow:none}.btn.danger{background:#35131b;box-shadow:none}.hero{padding:62px 0 34px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--o2);font-weight:900}h1{font-size:clamp(50px,9vw,92px);line-height:.88;letter-spacing:-.07em;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:18px;overflow:hidden;margin-top:28px;border:1px solid var(--line)}.metric{padding:18px;background:rgba(18,16,24,.96)}.metric small{display:block;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.08em}.metric strong{display:block;margin-top:6px;font-size:21px}section{padding:46px 0}h2{font-size:clamp(38px,8vw,64px);letter-spacing:-.05em;margin:8px 0 26px}.rank-list,.admin-list{display:grid;gap:14px}.rank-card,.admin-row{background:linear-gradient(180deg,#15121b,#0f0d14);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;animation:cardIn .45s ease both}.rank-card:nth-child(2){animation-delay:.06s}.rank-card:nth-child(3){animation-delay:.12s}.rank-card:nth-child(n+4){animation-delay:.18s}@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}.rank-card.first{border-color:rgba(255,211,77,.72);box-shadow:0 0 0 1px rgba(255,211,77,.09),0 12px 36px rgba(255,183,0,.10)}.rank-card.second{border-color:rgba(217,221,228,.55);box-shadow:0 12px 30px rgba(190,200,215,.06)}.rank-card.third{border-color:rgba(217,134,69,.55);box-shadow:0 12px 30px rgba(217,134,69,.07)}.rank-head{display:grid;grid-template-columns:82px 58px 1fr auto;gap:12px;align-items:center;padding:14px;cursor:pointer}.place{height:72px;border-radius:14px;display:grid;place-items:center;background:#0d0a11;border:1px solid #33293d;font-weight:950;font-size:27px;line-height:1;text-align:center;position:relative;overflow:hidden}.place small{display:block;font-size:15px;margin-top:2px}.first .place{color:var(--gold);background:linear-gradient(180deg,rgba(255,211,77,.16),rgba(255,211,77,.05));border-color:rgba(255,211,77,.4);text-shadow:0 0 16px rgba(255,211,77,.45)}.second .place{color:var(--silver);background:linear-gradient(180deg,rgba(217,221,228,.13),rgba(217,221,228,.04));border-color:rgba(217,221,228,.34)}.third .place{color:var(--bronze);background:linear-gradient(180deg,rgba(217,134,69,.14),rgba(217,134,69,.04));border-color:rgba(217,134,69,.35)}.mini-logo{width:58px;height:58px;border-radius:12px;background:#09070c;display:grid;place-items:center;overflow:hidden;font-weight:900;color:#75657f}.mini-logo img{width:100%;height:100%;object-fit:contain;padding:5px}.team-title{display:grid;gap:7px;min-width:0}.team-title strong{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#0d0a11;border:1px solid #382f43;color:#d0c8d5}.badge.em{color:#ff9f55;border-color:#6f3a16}.badge.points{font-weight:850;color:#fff}.arrow{width:42px;height:42px;border-radius:12px;border:1px solid #40344b;background:#0d0a11;display:grid;place-items:center;transition:.22s;color:var(--o2);font-size:22px}.open>.rank-head .arrow,.open>.expand-head .arrow{transform:rotate(180deg)}.expand-head{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}.expand-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}.open>.expand-body{grid-template-rows:1fr;border-top:1px solid #2b2235}.expand-inner{overflow:hidden}.body-pad{padding:14px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.detail{padding:11px;background:#0c0910;border-radius:11px;border:1px solid #2d2436}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.detail strong{display:block;margin-top:5px;font-size:18px}.falls-view{display:grid;gap:8px;margin-top:10px}.fall-view{display:grid;grid-template-columns:58px 1fr 1fr 1fr;gap:8px;padding:9px;background:#0b0810;border:1px solid #2b2234;border-radius:10px;align-items:center}.fall-view strong:last-child{text-align:right;color:var(--o2)}.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#0d0a11;border:1px solid #28202f;color:#8f8697;font-size:12px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:100;padding:14px}.modal.open{display:flex}.modal-card{width:min(100%,760px);max-height:92vh;overflow:auto;background:#110d17;border:1px solid #3a2e47;border-radius:20px}.modal-head{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #2b2136}.modal-body{padding:18px}.field{display:grid;gap:6px;margin-bottom:12px}label{font-size:10px;color:#aaa;text-transform:uppercase}input,select{width:100%;min-height:44px;background:#0b0810;color:#fff;border:1px solid #3a2e46;border-radius:10px;padding:0 11px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:9px;border-radius:9px;background:#17121f;color:#fff;border:1px solid var(--line)}.panel{display:none}.panel.active{display:block}.falls{display:grid;gap:10px;margin-top:12px}.fall{display:grid;grid-template-columns:48px 1fr 1fr 70px;gap:7px;align-items:end;background:#0d0a12;padding:8px;border-radius:10px}.q,.pts{height:42px;display:grid;place-items:center;background:#18111f;border-radius:8px}.total{display:flex;justify-content:space-between;padding:10px;margin-top:10px;background:#20130d;border-radius:9px}.actions{display:flex;gap:8px;margin-top:10px}.actions .btn:first-child{flex:1}.msg{color:#ffb5be;font-size:12px;margin-top:8px}@media(max-width:650px){.metrics{grid-template-columns:1fr}.rank-head{grid-template-columns:64px 52px 1fr auto;gap:9px;padding:12px}.place{height:64px;font-size:24px}.mini-logo{width:52px;height:52px}.team-title strong{font-size:17px}.badge{font-size:10px}.arrow{width:38px;height:38px}.details{grid-template-columns:1fr 1fr}.fall-view{grid-template-columns:46px 1fr 1fr 1fr;font-size:12px}}@media(max-width:430px){.rank-head{grid-template-columns:58px 48px 1fr 36px;gap:8px}.place{height:58px;font-size:21px}.mini-logo{width:48px;height:48px}.badge{padding:4px 6px}.arrow{width:36px;height:36px}}</style></head><body><header><div class="container nav"><div class="brand">FLOWFIRE <span>CHAMPIONS</span></div><button class="btn" onclick="openAdmin()">Admin</button></div></header><section class="hero"><div class="container"><div class="eyebrow">Flowfire Champions apresenta</div><h1>FUSÃO<br><span>SUPREMA</span></h1><div class="metrics"><div class="metric"><small>Período</small><strong id="period">—</strong></div><div class="metric"><small>Equipes</small><strong id="count">0</strong></div><div class="metric"><small>Modo</small><strong>SQUAD</strong></div></div></div></section><section><div class="container"><div class="eyebrow">Pontuação oficial</div><h2>Ranking</h2><div id="rankingCards" class="rank-list"></div><div class="note">Ranking atualizado automaticamente conforme TOP e kills lançados pelo Admin.</div></div></section><div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><strong>Administração</strong><button class="btn ghost" onclick="closeAdmin()">X</button></div><div class="modal-body"><div id="login"><div class="field"><label>Senha</label><input id="pass" type="password" inputmode="numeric"></div><button class="btn" onclick="doLogin()">Entrar</button><div id="loginMsg" class="msg"></div></div><div id="panel" style="display:none"><div class="tabs"><button class="tab" onclick="tab('cad')">Cadastrar equipe</button><button class="tab" onclick="tab('res')">Resultados</button></div><div id="cad" class="panel active"><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Status</label><select id="status"><option>Confirmada</option><option>Pendente</option><option>Eliminada</option></select></div><div class="field"><label>Logo</label><input id="logo" type="file" accept="image/*"></div><button class="btn" onclick="saveTeam()">Cadastrar equipe</button><div id="teamMsg" class="msg"></div></div><div id="res" class="panel"><div id="adminTeams" class="admin-list"></div></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://bbisshfqavavfhlpdanr.supabase.co',K='sb_publishable_svdaoEGpBlBEhFuqy-w7lA_I_B3KBdt',E=U+'/functions/v1/flowfire-manual-admin',db=supabase.createClient(U,K);let key=sessionStorage.getItem('ffa')||'',teams=[],results=[],settings={},logoData='';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const[a,b,c]=await Promise.all([db.from('flowfire_manual_settings').select('*').eq('id',1).single(),db.from('flowfire_manual_teams').select('*').order('created_at'),db.from('flowfire_manual_results').select('*').order('fall_number')]);settings=a.data||{};teams=b.data||[];results=c.data||[];render()}function fallPts(r){return +(settings.placement_points?.[r.placement]||0)+(+r.kills||0)*(+settings.kill_point||0)}function rows(id){return results.filter(r=>r.team_id===id).sort((a,b)=>a.fall_number-b.fall_number)}function total(id){const a=rows(id);return{q:a.length,k:a.reduce((s,r)=>s+(+r.kills||0),0),p:a.reduce((s,r)=>s+fallPts(r),0),best:a.length?Math.min(...a.map(r=>+r.placement)):99,last:a.length?a[a.length-1]:null}}function toggleCard(id){document.getElementById(id)?.classList.toggle('open')}function rankClass(i){return i===0?'first':i===1?'second':i===2?'third':''}function placeIcon(i){return i===0?'🏆':i===1?'🥈':i===2?'🥉':''}function render(){period.textContent=settings.period||'—';count.textContent=teams.length;const ranked=teams.map(t=>({...t,x:total(t.id)})).sort((a,b)=>b.x.p-a.x.p||b.x.k-a.x.k||a.x.best-b.x.best);rankingCards.innerHTML=ranked.map((t,i)=>{const x=t.x,l=x.last,rs=rows(t.id);return '<div class="rank-card '+rankClass(i)+'" id="team-'+t.id+'"><div class="rank-head" onclick="toggleCard(\'team-'+t.id+'\')"><div class="place">'+(i+1)+'º<small>'+placeIcon(i)+'</small></div><div class="mini-logo">'+(t.logo_data?'<img src="'+t.logo_data+'">':esc(t.name[0]))+'</div><div class="team-title"><strong>'+esc(t.name)+'</strong><div class="badges"><span class="badge em">'+x.p+' pts</span><span class="badge points">'+x.k+' kills</span>'+(l?'<span class="badge">Q'+l.fall_number+' TOP '+l.placement+'</span>':'')+'</div></div><div class="arrow">⌄</div></div><div class="expand-body"><div class="expand-inner"><div class="body-pad"><div class="details"><div class="detail"><small>Quedas</small><strong>'+x.q+'</strong></div><div class="detail"><small>Kills</small><strong>'+x.k+'</strong></div><div class="detail"><small>Pontos</small><strong>'+x.p+'</strong></div></div><div class="falls-view">'+rs.map(r=>'<div class="fall-view"><strong>Q'+r.fall_number+'</strong><span>TOP '+r.placement+'</span><span>'+r.kills+' kills</span><strong>'+fallPts(r)+' pts</strong></div>').join('')+'</div></div></div></div></div>'}).join('');renderAdmin()}function renderAdmin(){adminTeams.innerHTML=teams.map(t=>{const rs=rows(t.id),x=total(t.id);return '<div class="admin-row" id="adm-'+t.id+'"><div class="expand-head" onclick="toggleCard(\'adm-'+t.id+'\')"><div class="mini-logo">'+(t.logo_data?'<img src="'+t.logo_data+'">':esc(t.name[0]))+'</div><div class="team-title"><strong>'+esc(t.name)+'</strong><div class="badges"><span class="badge">'+x.q+' quedas</span><span class="badge">'+x.k+' kills</span><span class="badge">'+x.p+' pts</span></div></div><div class="arrow">⌄</div></div><div class="expand-body"><div class="expand-inner"><div class="body-pad"><div class="falls">'+rs.map(r=>'<div class="fall"><div class="q">Q'+r.fall_number+'</div><div class="field"><label>TOP</label><input id="p-'+r.id+'" type="number" min="1" max="12" value="'+r.placement+'"></div><div class="field"><label>KILLS</label><input id="k-'+r.id+'" type="number" min="0" value="'+r.kills+'"></div><div><label>PTS</label><div class="pts">'+fallPts(r)+'</div></div></div>').join('')+'</div><div class="total"><span>Total</span><strong>'+x.p+' pts</strong></div><div class="actions"><button class="btn" onclick="event.stopPropagation();addFall(\''+t.id+'\')">+ Queda</button><button class="btn danger" onclick="event.stopPropagation();delTeam(\''+t.id+'\')">Excluir</button></div>'+(rs.length?'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="event.stopPropagation();saveFalls(\''+t.id+'\')">Salvar TOP e kills</button>':'')+'</div></div></div></div>'}).join('')}async function call(x){const r=await fetch(E,{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify(x)}),j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j.data}function openAdmin(){modal.classList.add('open');if(key){login.style.display='none';panel.style.display='block'}}function closeAdmin(){modal.classList.remove('open')}async function doLogin(){try{key=pass.value;await call({action:'ping'});sessionStorage.setItem('ffa',key);login.style.display='none';panel.style.display='block'}catch(e){key='';loginMsg.textContent=e.message}}function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id))}logo.onchange=async e=>{const f=e.target.files[0];if(!f)return;logoData=await new Promise((ok,no)=>{const fr=new FileReader;fr.onload=()=>{const im=new Image;im.onload=()=>{let s=Math.min(1,300/im.width,300/im.height),w=im.width*s,h=im.height*s,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/webp',.78))};im.onerror=no;im.src=fr.result};fr.readAsDataURL(f)})};async function saveTeam(){teamMsg.textContent='';if(!name.value.trim()){teamMsg.textContent='Digite o nome.';return}try{await call({action:'save_team',name:name.value.trim(),status:status.value,logo_data:logoData||null});name.value='';logo.value='';logoData='';await load();tab('res')}catch(e){teamMsg.textContent=e.message}}async function addFall(id){const a=rows(id),n=a.length?Math.max(...a.map(r=>r.fall_number))+1:1;try{await call({action:'save_result',team_id:id,fall_number:n,placement:12,kills:0});await load();setTimeout(()=>document.getElementById('adm-'+id)?.classList.add('open'),0)}catch(e){alert(e.message)}}async function saveFalls(id){try{for(const r of rows(id))await call({action:'save_result',team_id:id,fall_number:r.fall_number,placement:+document.getElementById('p-'+r.id).value,kills:+document.getElementById('k-'+r.id).value});await load();setTimeout(()=>document.getElementById('adm-'+id)?.classList.add('open'),0)}catch(e){alert(e.message)}}async function delTeam(id){if(confirm('Excluir equipe?')){try{await call({action:'delete_team',id});await load()}catch(e){alert(e.message)}}}load()</script></body></html>
